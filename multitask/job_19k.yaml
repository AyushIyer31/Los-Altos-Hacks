# Train the Stage-2 ddG pipeline on the OLDER 19K data and evaluate on S669,
# to compare against the 1M-data model.
#   kubectl apply -f job_19k.yaml ; kubectl logs -f job/petlab-19k -n gilpin-lab
apiVersion: batch/v1
kind: Job
metadata:
  name: petlab-19k
  namespace: gilpin-lab
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
      containers:
        - name: t19k
          image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
          workingDir: /workspace/multitask
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir pandas numpy scikit-learn joblib \
                fair-esm xgboost lightgbm catboost
              nvidia-smi
              python build_train_eval_19k.py
          resources:
            requests: {nvidia.com/gpu: "1", cpu: "8", memory: 64Gi}
            limits:   {nvidia.com/gpu: "1", cpu: "8", memory: 64Gi}
          volumeMounts:
            - {name: project, mountPath: /workspace}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: project
          persistentVolumeClaim:
            claimName: petlab-multitask-pvc
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
